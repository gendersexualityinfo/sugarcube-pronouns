name: An idea or request
description: Suggest something new, or a change to something that's already here.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea!
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help your game or your players?
